<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS3 Embedded Fonts</title>

<style type="text/css">

@font-face {
    font-family: 'DarkHorse4';
    src: url('fonts/Darkh4.eot');
    src: url('fonts/Darkh4.eot?#iefix') format('embedded-opentype'),
         url('fonts/Darkh4.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

p {
    font-family: 'DarkHorse4', Geneva, serif;
    font-size: 36px;
}

</style>


</head>
<body>

<p>
	What is your favorite Western movie?  This font is called Bleeding Cowboys.  Does it make you think of the wild, wild West?
</p>



</body></html>
